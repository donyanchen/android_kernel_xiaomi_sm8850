name: Vendor Source

# 把 ACK 源码压缩包切块提交进本仓库（GitHub 单文件上限 100 MB）。
# 之后 Build Kernel 直接从仓库里拼回来解压，不再访问外部站点。
#
# 产物：
#   vendor/ack/common-<branch>.tar.gz.part-00 … part-NN
#   vendor/ack/manifest.json   （分块清单 + 整体 SHA256）

on:
  workflow_dispatch:
    inputs:
      ack_branch:
        description: 'ACK 分支'
        required: true
        default: 'android16-6.12-2026-03'
        type: string
      chunk_mb:
        description: '分块大小 MB（上限 90）'
        required: true
        default: '90'
        type: string

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 ACK 压缩包
        run: |
          mkdir -p /tmp/src
          curl -L --retry 3 --retry-delay 5 -o /tmp/src/ack.tar.gz \
            "https://android.googlesource.com/kernel/common/+archive/refs/heads/${{ inputs.ack_branch }}.tar.gz"
          ls -lh /tmp/src/ack.tar.gz
          sha256sum /tmp/src/ack.tar.gz

      - name: 切块
        run: |
          CHUNK=$(( ${{ inputs.chunk_mb }} * 1024 * 1024 ))
          OUT="vendor/ack"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cd /tmp/src
          split -b "$CHUNK" -d -a 2 ack.tar.gz part-
          ls -lh part-* | head
          mv part-* "$GITHUB_WORKSPACE/$OUT/"
          cd "$GITHUB_WORKSPACE/$OUT"
          for f in part-*; do mv "$f" "common-${{ inputs.ack_branch }}.tar.gz.$f"; done
          ls -lh | head

          python3 "$GITHUB_WORKSPACE/scripts/gen_vendor_manifest.py" vendor/ack
        env:
          ACK_BRANCH: ${{ inputs.ack_branch }}

      - name: 提交到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          du -sh vendor/ack
          git add vendor/ack
          git commit -m "vendor: ACK 源码分块提交（${{ inputs.ack_branch }}）" || echo "无变化"
          git push
          echo "完成"

      - name: 汇总
        run: |
          {
            echo "## 源码已入库"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 分支 | \`${{ inputs.ack_branch }}\` |"
            echo "| 分块大小 | ${{ inputs.chunk_mb }} MB |"
            echo "| 分块数 | $(ls vendor/ack/*.part-* 2>/dev/null | wc -l) |"
            echo "| 总体积 | $(du -sh vendor/ack | cut -f1) |"
            echo ""
            echo "构建时用 \`cat vendor/ack/*.part-* > ack.tar.gz\` 拼回。"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
