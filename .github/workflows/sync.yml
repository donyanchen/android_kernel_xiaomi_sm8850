name: Upstream Sync

# 一键检查全部上游组件是否有更新。
# 手动运行即可（也可每周自动跑）。
#
# 注意：vermagic 必须与设备 vendor 模块一致（6.12.69-android16-6-4k）。
# 上游升到 6.12.7x 时不会自动切换——那会让 404 个厂商模块拒载。
# 本工作流负责「发现 + 报告」，是否升级由人工确认。

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: ACK 分支检查
        id: ack
        run: |
          CUR=$(python3 -c "import json;print(json.load(open('manifest/source.json'))['sources']['ack']['branch'])" 2>/dev/null || echo "")
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "当前: $CUR"

          git ls-remote --heads https://android.googlesource.com/kernel/common 2>/dev/null \
            | awk '{print $2}' | sed 's#refs/heads/##' \
            | grep -E '^android16-6\.12-[0-9]{4}-[0-9]{2}$' | sort -r > /tmp/b.txt
          LATEST=$(head -1 /tmp/b.txt)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "最新: $LATEST"

          SUB=$(curl -sL -m 30 "https://android.googlesource.com/kernel/common/+/refs/heads/$LATEST/Makefile?format=TEXT" 2>/dev/null | base64 -d 2>/dev/null | grep -E "^SUBLEVEL =" | head -1 | awk '{print $3}')
          echo "latest_sub=$SUB" >> "$GITHUB_OUTPUT"
          echo "最新 SUBLEVEL: $SUB"

      - name: 各组件版本检查
        id: comps
        run: |
          SUKI=$(curl -sL -m 30 https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/commits/main 2>/dev/null | grep -m1 '"sha"' | cut -d'"' -f4 | cut -c1-12)
          echo "sukisu=$SUKI" >> "$GITHUB_OUTPUT"

          SEW=$(curl -sL -m 30 https://api.github.com/repos/donothavename/opt_gki_kernel_android13-5.15/commits/main 2>/dev/null | grep -m1 '"sha"' | cut -d'"' -f4 | cut -c1-12)
          echo "sew=$SEW" >> "$GITHUB_OUTPUT"

          ADIOS=$(curl -sL -m 30 https://api.github.com/repos/firelzrd/adios/commits/main 2>/dev/null | grep -m1 '"sha"' | cut -d'"' -f4 | cut -c1-12)
          echo "adios=$ADIOS" >> "$GITHUB_OUTPUT"

          echo "SukiSU: $SUKI"
          echo "opt_gki_kernel: $SEW"
          echo "ADIOS: $ADIOS"

      - name: 检查仓库内源码是否过期
        id: vendor
        run: |
          if [ ! -f vendor/ack/manifest.json ]; then
            echo "stale=yes" >> "$GITHUB_OUTPUT"
            echo "仓库内无源码快照"
            exit 0
          fi
          STORED=$(python3 -c "import json;print(json.load(open('vendor/ack/manifest.json')).get('branch',''))" 2>/dev/null)
          echo "仓库内分支: $STORED"
          echo "上游最新: ${{ steps.ack.outputs.latest }}"
          if [ "$STORED" != "${{ steps.ack.outputs.latest }}" ]; then
            echo "stale=yes" >> "$GITHUB_OUTPUT"
            echo "→ 需要重新入库"
          else
            echo "stale=no" >> "$GITHUB_OUTPUT"
            echo "→ 已是最新"
          fi

      - name: 自动重新入库（源码有新版本时）
        if: steps.vendor.outputs.stale == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "触发 Vendor Source 工作流"
          gh workflow run vendor-source.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f ack_branch=${{ steps.ack.outputs.latest }} -f chunk_mb=90
          echo "已触发，稍后检查"

      - name: 生成报告
        run: |
          {
            echo "## 上游组件状态"
            echo ""
            echo "| 组件 | 版本 / 提交 |"
            echo "|---|---|"
            echo "| ACK 当前分支 | \`${{ steps.ack.outputs.current }}\` |"
            echo "| ACK 最新分支 | \`${{ steps.ack.outputs.latest }}\` |"
            echo "| 最新 SUBLEVEL | \`${{ steps.ack.outputs.latest_sub }}\` |"
            echo "| SukiSU main | \`${{ steps.comps.outputs.sukisu }}\` |"
            echo "| opt_gki_kernel main | \`${{ steps.comps.outputs.sew }}\` |"
            echo "| ADIOS main | \`${{ steps.comps.outputs.adios }}\` |"
            echo ""
            echo "**设备 vermagic 要求**: \`6.12.69-android16-6-4k\`"
            echo ""
            echo "### 自动跟随（每次构建实时拉取，无需操作）"
            echo "- SukiSU main"
            echo "- opt_gki_kernel main"
            echo "- ADIOS / LZ4KD 补丁"
            echo ""
            echo "### 需要人工确认"
            echo "- ACK 分支升级：SUBLEVEL 必须为 69，否则模块拒载"
            echo "- 升级后必须重跑 ABI 校验（\`kobject_uevent_env\` = \`0x8bb6d45c\`）"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: 分支有变化时开 Issue
        if: steps.ack.outputs.current != steps.ack.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="上游 ACK 有新分支: ${{ steps.ack.outputs.latest }}"
          EXIST=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXIST" ]; then
            echo "Issue #$EXIST 已存在"
            exit 0
          fi
          BODY=$(printf '上游出现新分支 `%s`（SUBLEVEL `%s`）。\n\n当前使用 `%s`。\n\n升级前提：\n1. SUBLEVEL 必须与 vendor 模块 vermagic 一致（6.12.69）\n2. 升级后跑 ABI 校验：kobject_uevent_env CRC = 0x8bb6d45c，struct module = 1600 字节 / 75 成员\n3. 校验不过不要发布\n' "${{ steps.ack.outputs.latest }}" "${{ steps.ack.outputs.latest_sub }}" "${{ steps.ack.outputs.current }}")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
