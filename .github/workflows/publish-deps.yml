name: Publish Deps

# 把构建所需的全部外部依赖打成一个 Release 发布到本仓库。
# 之后 Build Kernel 只从本仓库下载，不再依赖任何外部站点。
#
# 资源清单：
#   ack-common.tar.gz        ACK 内核源码（约 243 MB 压缩 / 3 GB 解压）
#   clang-r536225.tar.gz     Google 官方 clang 工具链
#   rust-1.82.0.tar.gz       Google 官方 rust 工具链
#   sukisu-main.tar.gz       SukiSU Ultra 源码
#   opt-gki-main.tar.gz      小米优化移植包
#   adios-3.3.0.patch        ADIOS IO 调度器补丁
#   lz4kd.patch              LZ4KD 压缩补丁
#   deps.json                版本清单 + SHA256

on:
  workflow_dispatch:
    inputs:
      ack_branch:
        description: 'ACK 分支'
        required: true
        default: 'android16-6.12-2026-03'
        type: string
      tag:
        description: 'Release 标签'
        required: true
        default: 'deps'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: 准备目录
        run: mkdir -p dist

      - name: 下载 ACK 源码
        run: |
          curl -L --retry 3 --retry-delay 5 -o "dist/ack-common.tar.gz" \
            "https://android.googlesource.com/kernel/common/+archive/refs/heads/${{ inputs.ack_branch }}.tar.gz"
          ls -lh dist/ack-common.tar.gz

      - name: 下载 clang
        run: |
          curl -L --retry 3 --retry-delay 5 -o "dist/clang-r536225.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
          ls -lh dist/clang-r536225.tar.gz

      - name: 下载 rust
        run: |
          curl -L --retry 3 --retry-delay 5 -o "dist/rust-1.82.0.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/rust/+archive/refs/heads/main/linux-x86/1.82.0.tar.gz"
          ls -lh dist/rust-1.82.0.tar.gz

      - name: 下载 SukiSU 源码
        run: |
          curl -L --retry 3 --retry-delay 5 -o /tmp/sukisu.tar.gz \
            "https://github.com/SukiSU-Ultra/SukiSU-Ultra/archive/refs/heads/main.tar.gz"
          mv /tmp/sukisu.tar.gz "dist/sukisu-main.tar.gz"
          ls -lh dist/sukisu-main.tar.gz

      - name: 下载小米优化移植包
        run: |
          curl -L --retry 3 --retry-delay 5 -o /tmp/sew.tar.gz \
            "https://github.com/donothavename/opt_gki_kernel_android13-5.15/archive/refs/heads/main.tar.gz"
          mv /tmp/sew.tar.gz "dist/opt-gki-main.tar.gz"
          ls -lh dist/opt-gki-main.tar.gz

      - name: 下载补丁
        run: |
          curl -L --retry 3 --retry-delay 5 -o "dist/adios-3.3.0.patch" \
            "https://raw.githubusercontent.com/firelzrd/adios/main/patches/stable/0001-linux6.12.44-ADIOS-3.3.0.patch"
          curl -L --retry 3 --retry-delay 5 -o "dist/lz4kd.patch" \
            "https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8850/main/other_patch/lz4kd.patch"
          ls -lh dist/*.patch

      - name: 生成版本清单
        env:
          ACK_BRANCH: ${{ inputs.ack_branch }}
        run: |
          git clone --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/repo
          cp /tmp/repo/scripts/gen_deps_manifest.py /tmp/ 2>/dev/null || true
          python3 /tmp/gen_deps_manifest.py dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "构建依赖 $TAG" \
              --notes "构建所需的全部外部依赖快照。Build Kernel 从这里取，不再访问外部站点。"
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "完成: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
