name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: 'Root 方案（sukisu / fina）'
        required: true
        default: 'sukisu'
        type: string
      device:
        description: '目标设备代号（pudding=小米17 / myron=红米K90ProMax）'
        required: true
        default: 'pudding'
        type: string
      ack_branch:
        description: 'ACK 源码分支'
        required: true
        default: 'android16-6.12-2026-03'
        type: string
      ack_commit:
        description: 'ACK 源码提交（必须钉死，留空用默认 #82 基线）'
        required: false
        default: ''
        type: string
      publish:
        description: '发布方式（draft=先建草稿，人工验证后再公开；public=直接公开；none=只留 artifact 不建 Release）'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - public
          - none
      boot_template:
        description: '原版 boot 整分区镜像（URL 或私有 Release 资产名；留空用 boot_template_<dev>.img.gz）'
        required: false
        default: ''
        type: string
      kpm:
        description: '启用内建 KPM'
        required: true
        default: true
        type: boolean
      features:
        description: '启用额外特性配置'
        required: true
        default: true
        type: boolean
      disp_version:
        description: '内核显示版本串（默认对齐原厂，改这里可自定义）'
        required: false
        default: ''
        type: string
      backport_exclude:
        description: '临时排除的 backport 补丁（冒号分隔的关键字，如 150-ufs:500-xhci）'
        required: false
        default: ''
        type: string
      sew_opt:
        description: '应用小米优化移植包（mi_rmap/kshrink/unfairmem/unionpower 等，5.15→6.12 移植，可能失败）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境准备
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev \
            libelf-dev libdw-dev lz4 zstd python3 zip unzip \
            aria2 ccache rsync cpio libncurses-dev kmod

      - name: 解析上游提交（钉死，不跟分支 HEAD）
        id: rev
        run: |
          # 写死 commit：ACK 分支是移动分支，ls-remote 取 HEAD 会让每次构建的基线都不同
          # （#82 = 162041188e，10-27 之后 = bd23acc843，差 6 个提交，无法复现）。
          # 仓库里并没有 vendor/ack，所以"仓库内分块源码"分支永远不会命中。
          SHA="${{ inputs.ack_commit }}"
          [ -z "$SHA" ] && SHA="162041188e96c974a8078481672bfddc1ca10f9a"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "ACK 钉死 @ $SHA"

      - name: 恢复源码与工具链缓存
        id: srccache
        uses: actions/cache@v4
        with:
          path: |
            cache/common
            cache/clang19
            cache/rust
          key: srccache-${{ inputs.ack_branch }}-${{ steps.rev.outputs.commit }}

      # ccache 缓存已在 2026-10-28 实验性移除（怀疑导致产物异常）

      - name: 依赖下载辅助
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          # 依赖已迁到私有仓库，私有 Release 资产必须走 API 端点。
          # 用 base64 落盘，避免 printf/sed 的转义把脚本内容改坏。
          mkdir -p /usr/local/bin
          echo '' | base64 -d > /usr/local/bin/getdep
          chmod +x /usr/local/bin/getdep
          bash -n /usr/local/bin/getdep && echo "getdep 语法检查通过"

      - name: 准备 ACK 源码
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p ws cache
          # ① 仓库内分块源码（离线、最高优先级）
          PARTS=$(ls vendor/ack/*.part-* 2>/dev/null | head -1)
          if [ -n "$PARTS" ]; then
            echo "✓ 使用仓库内分块源码（vendor/ack）"
            cat vendor/ack/*.part-* > /tmp/ack.tar.gz
            echo "拼回大小: $(du -h /tmp/ack.tar.gz | cut -f1)"
            if [ -f vendor/ack/manifest.json ]; then
              WANT=$(python3 -c "import json;print(json.load(open('vendor/ack/manifest.json'))['sha256'])" 2>/dev/null || echo "")
              GOT=$(sha256sum /tmp/ack.tar.gz | cut -d' ' -f1)
              [ -n "$WANT" ] && echo "SHA256 校验: $([ "$WANT" = "$GOT" ] && echo 通过 || echo 不匹配)"
            fi
            mkdir -p ws/common
            tar xzf /tmp/ack.tar.gz -C ws/common
            rm -f /tmp/ack.tar.gz
            echo "文件数: $(find ws/common -type f | wc -l)"
            head -3 ws/common/Makefile
            exit 0
          fi
          # ② 本地缓存
          if [ -f cache/common/Makefile ]; then
            echo "✓ 缓存命中，跳过下载（rsync 到 ws/common）"
            mkdir -p ws/common
            rsync -a --delete cache/common/ ws/common/
            head -3 ws/common/Makefile
            exit 0
          fi
          cd ws
          BRANCH="${{ inputs.ack_branch }}"
          echo "分支: $BRANCH"
          SHA="${{ steps.rev.outputs.commit }}"
          UPSTREAM="https://android.googlesource.com/kernel/common/+archive/${SHA}.tar.gz"
          echo "--- 尝试私有仓库 Release"
          if getdep ack-common.tar.gz ack.tar.gz; then
            echo "✓ 来自私有仓库 Release"
          else
            echo "--- 回退到上游"
            curl -L --retry 3 --retry-delay 5 -o ack.tar.gz "$UPSTREAM"
          fi
          ls -lh ack.tar.gz
          mkdir -p common
          tar xzf ack.tar.gz -C common
          head -3 common/Makefile
          echo "文件数: $(find common -type f | wc -l)"
          echo "--- 写入缓存目录"
          mkdir -p "$GITHUB_WORKSPACE/cache"
          rsync -a common/ "$GITHUB_WORKSPACE/cache/common/"

      - name: 准备工具链
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p ws cache
          if [ -x cache/clang19/bin/clang ] && [ -x cache/rust/bin/rustc ]; then
            echo "✓ 工具链缓存命中"
            rsync -a cache/clang19/ ws/clang19/
            rsync -a cache/rust/ ws/rust/
            ls ws/clang19/bin/clang ws/rust/bin/rustc
            exit 0
          fi
          cd ws
          GC=https://android.googlesource.com/platform/prebuilts
          echo "--- clang r536225"
          if getdep clang-r536225.tar.gz clang.tar.gz; then
            echo "✓ clang 来自私有仓库 Release"
          else
            curl -L --retry 3 --retry-delay 5 -o clang.tar.gz \
              "$GC/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
          fi
          mkdir -p clang19 && tar xzf clang.tar.gz -C clang19
          echo "--- rust 1.82.0"
          if [ -x cache/rust/bin/rustc ] && [ -x cache/rust/bin/bindgen ]; then
            echo "rust/bindgen 缓存命中"
          else
            getdep rust-1.82.0.tar.gz rust.tar.gz
            mkdir -p rust && tar xzf rust.tar.gz -C rust && rm -f rust.tar.gz
            getdep bindgen-0.69.5.tar.gz bindgen.tgz
            tar xzf bindgen.tgz -C rust/bin && rm -f bindgen.tgz
          fi
          ls rust/bin/rustc rust/bin/bindgen 2>&1
          ls clang19/bin/clang clang19/bin/ld.lld rust/bin/rustc 2>&1
          du -sh clang19 rust
          echo "--- 写入工具链缓存"
          mkdir -p "$GITHUB_WORKSPACE/cache"
          rsync -a clang19/ "$GITHUB_WORKSPACE/cache/clang19/"
          rsync -a rust/ "$GITHUB_WORKSPACE/cache/rust/"

      - name: 配置工具链
        run: |
          cd ws
          echo "$PWD/clang19/bin" >> "$GITHUB_PATH"
          echo "$PWD/build-tools/bin" >> "$GITHUB_PATH"
          echo "$PWD/rust/bin" >> "$GITHUB_PATH"
          ls -l clang19/bin/clang clang19/bin/ld.lld || true

      - name: 拉取私有配置
        run: |
          # ABI 符号表 / 原厂 defconfig / 厂商桩函数不随公开仓库分发。
          # 缺失时直接失败，避免用不完整配置编出废镜像。
          set -e
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "::error::缺少 secret PRIVATE_REPO_TOKEN"
            exit 1
          fi
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "${{ secrets.PRIVATE_REPO_TOKEN }}" > "$HOME/.git-credentials"
          rm -rf /tmp/priv
          DEV="${{ inputs.device }}"
          echo "目标设备: $DEV"
          git clone --depth 1 "https://github.com/donyanchen/${DEV}-private.git" /tmp/priv
          # myron 仓库的 defconfig 叫 configs/<dev>_full.defconfig，命名已统一
          mkdir -p configs vendor/xiaomi-stubs
          cp -f /tmp/priv/configs/* configs/
          cp -f /tmp/priv/vendor/xiaomi-stubs/* vendor/xiaomi-stubs/
          mkdir -p docs
          cp -f /tmp/priv/docs/HANDOVER.md docs/ 2>/dev/null || true
          rm -f "$HOME/.git-credentials"
          echo "私有配置已拉取："
          ls -la configs/ | tail -8
          ls -la vendor/xiaomi-stubs/

      - name: 集成 SukiSU
        run: |
          cd ws/common
          KSU="${{ inputs.ksu }}"
          [ -z "$KSU" ] && KSU=sukisu
          echo "Root 方案: $KSU"
          # SukiSU 版本必须钉死：setup.sh 传分支名会 checkout 分支 HEAD，
          # 导致每次构建的 SukiSU 代码都可能不同（同一 commit 却出现
          # ksu_ver 41085 / 41095 的差异），构建不可复现。
          # 传入 commit 后 git checkout <commit> 走 detached HEAD，版本固定。
          # 1b0a5ee4c4e8 = 发布版 Xiaomi17-build-261026134716 使用的版本
          SUKISU_REF="${SUKISU_REF:-1b0a5ee4c4e8}"
          echo "SukiSU 固定版本: $SUKISU_REF"
          if [ "$KSU" = "fina" ]; then
            export FOLKSU_URL="https://github.com/donyanchen/FinaSU.git"
            export FOLKSU_REF="pudding"
            curl -LSs "https://raw.githubusercontent.com/donyanchen/FinaSU/refs/heads/pudding/kernel/setup.sh" | bash -s pudding
          else
            export FOLKSU_URL="https://github.com/donyanchen/SukiSU-Ultra.git"
            export FOLKSU_REF="$SUKISU_REF"
            # setup.sh 也必须从钉死的 commit 取：走 refs/heads/pudding 的话，
            # 分支头一变，即使 SUKISU_REF 是 commit 也会拿到新的脚本（版本串已坐实漂移）。
            curl -LSs "https://raw.githubusercontent.com/donyanchen/SukiSU-Ultra/${SUKISU_REF}/kernel/setup.sh" | bash -s "$SUKISU_REF"
          fi
          echo "SukiSU 实际版本: $(cd KernelSU 2>/dev/null && git rev-parse HEAD 2>/dev/null || echo unknown)"
          echo "SukiSU 描述:     $(cd KernelSU 2>/dev/null && git describe --always --dirty 2>/dev/null || echo unknown)"
          UAPI_SRC=$(find . -maxdepth 3 -type d -name uapi | grep -i kernelsu | head -1)
          [ -z "$UAPI_SRC" ] && UAPI_SRC=$(find . -maxdepth 3 -type d -name uapi | head -1)
          echo "uapi 来源: $UAPI_SRC"
          mkdir -p drivers/kernelsu/uapi
          cp -f "$UAPI_SRC"/*.h drivers/kernelsu/uapi/ 2>/dev/null || true
          echo "uapi 头文件: $(ls drivers/kernelsu/uapi/ | wc -l) 个"

      - name: 兼容性补丁
        run: |
          cd ws/common
          python3 "$GITHUB_WORKSPACE/patches/fix_ksu_612.py"
          python3 "$GITHUB_WORKSPACE/patches/fix_ksu_lsm_612.py" . || true

      - name: 版本串（对齐原厂 /proc/version）
        id: ver
        run: |
          cd ws/common
          # 版本串：优先用工作流输入；否则从私有仓库的 uname.txt 读原厂真值
          DISP="${{ inputs.disp_version }}"
          if [ -z "$DISP" ] && [ -f "/tmp/priv/uname.txt" ]; then
            DISP="@/tmp/priv/uname.txt"
          fi
          python3 "$GITHUB_WORKSPACE/scripts/fake_version.py" . "$DISP"
          echo "--- 改后 ---"
          sed -n '28,32p' init/version-timestamp.c
          grep -c "14043575" init/version-timestamp.c || true
      - name: 应用 ADIOS IO 调度器补丁
        id: adios
        run: |
          cd ws/common
          URL="https://raw.githubusercontent.com/firelzrd/adios/main/patches/stable/0001-linux6.12.44-ADIOS-3.3.0.patch"
          curl -sL -o /tmp/adios.patch "$URL"
          echo "补丁大小: $(wc -c < /tmp/adios.patch) 字节"
          if patch -p1 --dry-run -F3 --no-backup-if-mismatch < /tmp/adios.patch > /tmp/dry.log 2>&1; then
            patch -p1 -F3 --no-backup-if-mismatch < /tmp/adios.patch
            echo "ADIOS_OK=1" >> "$GITHUB_ENV"
            echo "✅ ADIOS 补丁应用成功"
          else
            echo "⚠️ ADIOS 补丁不适用，跳过"
            grep -E "FAILED|Hunk|can't find" /tmp/dry.log | head -6
          fi

      - name: 应用 LZ4KD 补丁
        id: lz4kd
        continue-on-error: true
        run: |
          cd ws/common
          URL="https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8850/main/other_patch/lz4kd.patch"
          curl -sL -o /tmp/lz4kd.patch "$URL"
          echo "补丁大小: $(wc -c < /tmp/lz4kd.patch) 字节"
          if patch -p1 --dry-run -F3 --no-backup-if-mismatch < /tmp/lz4kd.patch > /tmp/lz4kd.log 2>&1; then
            patch -p1 -F3 --no-backup-if-mismatch < /tmp/lz4kd.patch
            echo "✅ LZ4KD 补丁应用成功"
          else
            echo "⚠️ LZ4KD 补丁与当前源码不匹配，跳过"
            grep -E "FAILED|Hunk|can't find" /tmp/lz4kd.log | head -5
          fi

      - name: 应用小米优化移植包
        if: inputs.sew_opt
        run: |
          curl -sL -o /tmp/sew.tar.gz \
            "https://github.com/donothavename/opt_gki_kernel_android13-5.15/archive/refs/heads/main.tar.gz"
          mkdir -p /tmp/sew && tar xzf /tmp/sew.tar.gz -C /tmp/sew
          SEW_DIR=$(ls -d /tmp/sew/*/ | head -1)
          echo "移植包: $SEW_DIR"
          export KERNEL_ROOT="$GITHUB_WORKSPACE/ws"
          DEV="${{ inputs.device }}"
          [ -z "$DEV" ] && DEV=pudding
          export DEFCONFIG="$GITHUB_WORKSPACE/ws/common/arch/arm64/configs/${DEV}_defconfig"
          echo "DEFCONFIG 存在: $([ -f "$DEFCONFIG" ] && echo yes || echo no)"
          bash "$GITHUB_WORKSPACE/scripts/apply_sew.sh" "$SEW_DIR" 2>&1 | tail -50 || true
          echo "--- 移除重复的 vendor hook 声明 ---"
          cd "$KERNEL_ROOT/common"
          python3 "$GITHUB_WORKSPACE/scripts/fix_vendor_hooks.py" . || true
          echo "--- 落地文件检查 ---"
          ls "$KERNEL_ROOT/common/mm" 2>/dev/null | grep -E "^sew_|mi_rmap|slabd" | head
          ls "$KERNEL_ROOT/common/drivers/xiaomi" 2>/dev/null | head -3
          ls "$KERNEL_ROOT/common/drivers/mihw" 2>/dev/null | head -3

      - name: 应用 backport 补丁（linux-6.12.y stable）
        env:
          BACKPORT_EXCLUDE: ${{ inputs.backport_exclude }}
        run: |
          cd "$GITHUB_WORKSPACE/ws/common"
          PAT="$GITHUB_WORKSPACE/patches/backport"
          if [ ! -d "$PAT" ]; then
            echo "无 backport 目录，跳过"
            exit 0
          fi

          # !!! 关键 !!!
          # ws/common 没有自己的 .git，git 会向上找到 $GITHUB_WORKSPACE/.git，
          # 于是 git apply 按父仓库根解析 'fs/f2fs/data.c'，路径不存在 -> 补丁被静默丢弃。
          # 设置 GIT_CEILING_DIRECTORIES 阻止向上查找，并把 git apply 换成 patch -p1。
          export GIT_CEILING_DIRECTORIES="$GITHUB_WORKSPACE"
          echo "已设置 GIT_CEILING_DIRECTORIES=$GIT_CEILING_DIRECTORIES"
          command -v patch >/dev/null || apk add --no-cache patch 2>/dev/null || true

          # ---------- 应用前快照：确认补丁真的改到文件 ----------
          echo "===== 补丁前状态 ====="
          echo "  PWD = $PWD"
          if git rev-parse --show-toplevel >/dev/null 2>&1; then
            echo "  git 仓库根 = $(git rev-parse --show-toplevel)"
            echo "  ⚠ 若仓库根不是 $PWD，补丁会被应用到错误路径！"
          else
            echo "  （非 git 仓库，git apply 按当前目录相对路径应用）"
          fi
          SNAP=/tmp/backport_before.md5
          : > "$SNAP"
          for f in fs/f2fs/data.c fs/f2fs/inode.c fs/f2fs/compress.c \
                   net/unix/af_unix.c mm/vmscan.c block/blk-core.c \
                   net/ipv6/addrconf.c kernel/sched/fair.c; do
            [ -f "$f" ] && md5sum "$f" >> "$SNAP"
          done
          echo "  已记录 $(wc -l < "$SNAP") 个关键文件指纹"

          ok=0; skip=0
          # 临时排除列表（二分排查用），冒号分隔
          EXCLUDE="${BACKPORT_EXCLUDE:-}"
          for p in "$PAT"/*.patch; do
            [ -f "$p" ] || continue
            name=$(basename "$p")
            if [ -n "$EXCLUDE" ]; then
              skip_hit=0
              for ex in $(echo "$EXCLUDE" | tr ':' ' '); do
                case "$name" in *"$ex"*) skip_hit=1;; esac
              done
              if [ "$skip_hit" = "1" ]; then
                echo "  [EXCLUDED] $name （二分排查排除）"
                skip=$((skip+1))
                continue
              fi
            fi
            # 用 patch -p1（按当前目录工作，不受 git 仓库根影响）
            if patch -p1 --dry-run --forward --no-backup-if-mismatch \
                     -i "$p" -d "$PWD" > /tmp/patch_dry.log 2>&1; then
              if patch -p1 --forward --no-backup-if-mismatch \
                       -i "$p" -d "$PWD" >> /tmp/patch.log 2>&1; then
                echo "  [OK]   $name"
                ok=$((ok+1))
              else
                echo "  [FAIL] $name 应用出错"
                tail -5 /tmp/patch.log
                skip=$((skip+1))
              fi
            else
              echo "  [SKIP] $name 上下文不匹配"
              grep -E "FAILED|Hunk|can't find|Reversed" /tmp/patch_dry.log | head -3
              skip=$((skip+1))
            fi
          done
          echo "backport 结果: 成功 $ok 个，跳过 $skip 个"

          # ---------- 应用后校验：文件必须真的变了 ----------
          echo
          echo "===== 补丁后校验 ====="
          if [ "$ok" -eq 0 ]; then
            echo "  本次没有任何补丁被应用（全部排除或全部跳过），跳过校验"
            echo "  ✓ 无补丁构建"
            exit 0
          fi
          CHANGED_FILES=0
          [ -s "$SNAP" ] && CHANGED_FILES=$(md5sum -c "$SNAP" 2>/dev/null | grep -c FAILED || true)
          echo "  关键文件被修改数: $CHANGED_FILES / $(wc -l < "$SNAP")"

          # 具体特征检查
          FAIL=0
          if [ -f fs/f2fs/data.c ]; then
            C=$(grep -c "f2fs_submit_all_merged_ipu_writes" fs/f2fs/data.c || true)
            echo "  f2fs/data.c 新函数 f2fs_submit_all_merged_ipu_writes: $C 处"
            [ "$C" -ge 1 ] || { echo "  ::error::f2fs GC 死锁补丁未落到源码"; FAIL=1; }
          fi
          if [ -f net/unix/af_unix.c ]; then
            C=$(grep -c "last_len" net/unix/af_unix.c || true)
            echo "  af_unix.c 残留 last_len 引用: $C 处（补丁后应为 0）"
            [ "$C" -eq 0 ] || { echo "  ::error::unix-peek-uaf 补丁未落到源码"; FAIL=1; }
          fi
          if [ -f mm/vmscan.c ]; then
            C=$(grep -c "don't abort memcg reclaim to ensure fairness" mm/vmscan.c || true)
            echo "  vmscan.c 公平性注释残留: $C 处（mglru 补丁后应为 0）"
            [ "$C" -eq 0 ] || { echo "  ::error::mglru-proactive-reclaim 补丁未落到源码"; FAIL=1; }
          fi

          if [ "$CHANGED_FILES" -eq 0 ]; then
            echo "  ::error::补丁声称全部成功，但没有一个关键文件被修改"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "----- git status（诊断用）-----"
            git status --short 2>/dev/null | head -30 || true
            echo "----- 查找补丁是否落到别处 -----"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -name "f2fs" -type d 2>/dev/null | head -5
            exit 1
          fi
          echo "  ✓ 补丁已确认写入源码"

      - name: 集成高通开源子系统
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          # 用 sparse-checkout 只拉需要的子目录（仓库总 2.7GB）
          OP="https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8850.git"
          BR="oneplus/sm8850_b_16.0.0_oneplus_15"
          rm -rf qcom_src
          echo "--- sparse clone"
          if git clone --filter=blob:none --no-checkout --depth=1 -b "$BR" "$OP" qcom_src 2>&1 | tail -3; then
            cd qcom_src
            git sparse-checkout init --cone
            git sparse-checkout set \
              vendor/qcom/opensource/dataipa \
              vendor/qcom/opensource/synx-kernel \
              vendor/qcom/opensource/dsp-kernel \
              vendor/qcom/opensource/datarmnet \
              vendor/qcom/opensource/securemsm-kernel 2>&1 | tail -3
            git checkout 2>&1 | tail -3
            echo "--- 落地文件数: $(find vendor -type f 2>/dev/null | wc -l)"
            cd "$GITHUB_WORKSPACE"
            # 复制到内核树
            if [ -d qcom_src/vendor/qcom/opensource ]; then
              mkdir -p ws/common/drivers/qcom_opensource
              cp -a qcom_src/vendor/qcom/opensource/. ws/common/drivers/qcom_opensource/
              echo "✓ 已复制到 ws/common/drivers/qcom_opensource"
              ls ws/common/drivers/qcom_opensource
            fi
          else
            echo "⚠ 高通源码拉取失败，跳过（不影响主构建）"
          fi
          # 小米私有符号桩函数
          if [ -d "$GITHUB_WORKSPACE/vendor/xiaomi-stubs" ]; then
            mkdir -p ws/common/drivers/xiaomi-stubs
            cp -a "$GITHUB_WORKSPACE/vendor/xiaomi-stubs/." ws/common/drivers/xiaomi-stubs/
            echo "小米桩函数 $(grep -c EXPORT_SYMBOL ws/common/drivers/xiaomi-stubs/xiaomi_stubs.c) 个"
          fi

          # --- 把桩函数挂进内核构建系统 ---
          if [ -d ws/common/drivers/xiaomi-stubs ]; then
            cd ws/common
            # 1) drivers/Makefile 追加
            if ! grep -q 'xiaomi-stubs' drivers/Makefile 2>/dev/null; then
              echo 'obj-y += xiaomi-stubs/' >> drivers/Makefile
              echo "  ✓ drivers/Makefile 已挂载"
            fi
            # 2) drivers/Kconfig 追加 source
            if ! grep -q 'xiaomi-stubs' drivers/Kconfig 2>/dev/null; then
              echo 'source "drivers/xiaomi-stubs/Kconfig"' >> drivers/Kconfig
              echo "  ✓ drivers/Kconfig 已挂载"
            fi
            cd "$GITHUB_WORKSPACE"
          fi

      - name: 安装 bindgen（CONFIG_RUST / ASHMEM 必需）
        run: |
          export PATH="$PWD/ws/rust/bin:$PATH"
          echo "rustc: $(command -v rustc || echo 缺)"
          echo "cargo: $(command -v cargo || echo 缺)"
          if ! command -v bindgen >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq libclang-dev >/dev/null 2>&1 || true
            if command -v cargo >/dev/null 2>&1; then
              echo "用 cargo 安装 bindgen-cli"
              cargo install bindgen-cli --version 0.69.5 --root /tmp/bg >/dev/null 2>&1 || true
              export PATH="/tmp/bg/bin:$PATH"
            fi
          fi
          echo "bindgen: $(command -v bindgen || echo 未安装)"
          bindgen --version 2>&1 | head -1 || true
          if [ -x ws/common/scripts/rust_is_available.sh ]; then
            bash ws/common/scripts/rust_is_available.sh 2>&1 | tail -6 || true
          fi
          echo "/tmp/bg/bin" >> "$GITHUB_PATH"

      - name: 确保 bindgen 就位（不依赖缓存）
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p ws/rust/bin
          if [ ! -x ws/rust/bin/bindgen ]; then
            getdep bindgen-0.69.5.tar.gz /tmp/bg.tgz
            tar xzf /tmp/bg.tgz -C ws/rust/bin
            chmod +x ws/rust/bin/bindgen
          fi
          chmod +x ws/rust/bin/rustc 2>/dev/null || true
          echo "$PWD/ws/rust/bin" >> "$GITHUB_PATH"
          echo "bindgen: $(ws/rust/bin/bindgen --version)"
          echo "rustc:   $(ws/rust/bin/rustc -V)"

      - name: 配置内核
        run: |
          cd ws/common
          export PATH="$PWD/../rust/bin:$PATH"
          export LIBCLANG_PATH="$PWD/../clang19/lib"
          export BINDGEN=bindgen RUSTC=rustc
          DEV="${{ inputs.device }}"
          [ -z "$DEV" ] && DEV=pudding
          CFG="$GITHUB_WORKSPACE/configs/${DEV}_full.defconfig"
          echo "目标设备: $DEV"
          if [ -f "$CFG" ]; then
            echo "使用设备完整配置 ${DEV}_full.defconfig"
            cp "$CFG" arch/arm64/configs/${DEV}_defconfig
          else
            echo "设备配置缺失，回退 gki_defconfig"
            cp arch/arm64/configs/gki_defconfig arch/arm64/configs/${DEV}_defconfig
          fi
          ABI="$GITHUB_WORKSPACE/configs/${DEV}_abi.fragment"
          if [ -f "$ABI" ]; then
            echo "叠加 ABI 对齐片段"
            cat "$ABI" >> arch/arm64/configs/${DEV}_defconfig
          fi
          EXTRA="$GITHUB_WORKSPACE/configs/${DEV}_extra.config"
          if [ -f "$EXTRA" ]; then
            echo "叠加高通子系统配置"
            cat "$EXTRA" >> arch/arm64/configs/${DEV}_defconfig
          fi
          FEAT="$GITHUB_WORKSPACE/configs/features.config"
          if [ "${{ inputs.features }}" = "true" ] && [ -f "$FEAT" ]; then
            echo "叠加 features.config（TLS / AF_UNIX_OOB 等）"
            cat "$FEAT" >> arch/arm64/configs/${DEV}_defconfig
          fi
          # 跳过模块符号 CRC 校验（结构体实测与原厂一致）
          python3 "$GITHUB_WORKSPACE/scripts/patch_modversion.py" . || true
          python3 "$GITHUB_WORKSPACE/scripts/patch_vermagic.py" . || true
          # 解除 MODULE_SCMVERSION 对 LOCALVERSION_AUTO 的依赖
          python3 "$GITHUB_WORKSPACE/scripts/patch_kconfig.py" . || true
          WL="$GITHUB_WORKSPACE/configs/abi_symbollist.raw"
          if [ -f "$WL" ]; then
            cp "$WL" abi_symbollist.raw
            echo "ABI 白名单 $(wc -l < abi_symbollist.raw) 项"
          fi
          PL="$GITHUB_WORKSPACE/configs/protected_module_names_list"
          if [ -f "$PL" ]; then
            cp "$PL" protected_module_names_list
          else
            : > protected_module_names_list
          fi
          cp protected_module_names_list ../protected_module_names_list 2>/dev/null || true
          echo "protected_module_names_list 就位"
          if [ "$ADIOS_OK" = "1" ]; then
            echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> arch/arm64/configs/${DEV}_defconfig
          fi
          echo "defconfig 行数: $(wc -l < arch/arm64/configs/${DEV}_defconfig)"

      - name: 编译
        run: |
          cd ws/common
          export PATH="$PWD/../clang19/bin:$PWD/../build-tools/bin:$PWD/../rust/bin:$PATH"
          export KCFLAGS="-Wno-error=visibility -Wno-error=logical-op-parentheses -Wno-error=implicit-function-declaration -Wno-error=unused-result -Wno-error=c23-extensions"
          export ARCH=arm64
          # 2026-10-28 实验：完全弃用 ccache（怀疑其 sloppiness 参数导致错误复用目标文件）
          # CC 交由 LLVM=1 推导为 clang，不经过 ccache 包装
          export LLVM=1
          echo "  CC      = ${CC:-（由 LLVM=1 推导为 clang）}"
          echo "  which clang -> $(which clang)"
          echo "  ccache 已禁用"
          export RUSTC=rustc
          export BINDGEN=bindgen
          export LIBCLANG_PATH="$PWD/../clang19/lib"
          echo "bindgen: $(bindgen --version 2>&1 | head -1)"
          echo "rustc:   $(rustc -V 2>&1 | head -1)"
          echo "libclang: $(ls $LIBCLANG_PATH/libclang.so* 2>/dev/null | head -1)"
          echo "pahole: $(pahole --version 2>/dev/null || echo 未安装)"
          # 安装 pahole（BTF 生成必需）；apt 版本太旧则源码编译
          if ! pahole --version 2>/dev/null | grep -qE '1\.[2-9][0-9]'; then
            sudo apt-get update -qq > /dev/null 2>&1 || true
            sudo apt-get install -y -qq dwarves > /dev/null 2>&1 || true
          fi
          echo "pahole after: $(pahole --version 2>/dev/null || echo 仍未安装)"
          export KBUILD_BUILD_USER=kleaf
          export KBUILD_BUILD_HOST=build-host
          export KBUILD_BUILD_TIMESTAMP="Tue Sep  8 15:08:49 UTC 2026"
          DEV="${{ inputs.device }}"
          [ -z "$DEV" ] && DEV=pudding
          echo "编译目标设备: $DEV"
          ls -l arch/arm64/configs/${DEV}_defconfig || { echo "::error::缺少 ${DEV}_defconfig"; exit 1; }
          make ARCH=arm64 ${DEV}_defconfig > build.log 2>&1 || {
            echo "::error::defconfig 失败"; tail -40 build.log; exit 1; }
          # 内核编译并行度：nproc+2 通常最快（IO 与计算可重叠）
          JOBS=$(( $(nproc) + 2 ))
          echo "并行任务数: $JOBS (nproc=$(nproc))"
          START=$(date +%s)
          make ARCH=arm64 -j"$JOBS" Image >> build.log 2>&1 || {
            echo "::error::编译失败"; tail -60 build.log; exit 1; }
          END=$(date +%s)
          echo "编译耗时: $((END-START)) 秒"
          tail -20 build.log
          test -f arch/arm64/boot/Image
          ls -lh arch/arm64/boot/Image

      - name: 校验
        if: success()
        run: |
          cd ws/common
          IMG=arch/arm64/boot/Image
          DISP=$(strings -a "$IMG" | grep -oE '6\.12\.[0-9]+-android16-6-[a-z0-9]+-abogki[0-9]+-4k' | head -1)
          echo "  实际版本串: ${DISP:-未找到}"
          echo "===== vermagic（必须等于 6.12.69-android16-6-4k）====="
          strings -a "$IMG" | grep -E "^6\.12\..*SMP preempt" | head -2
          echo "===== 显示串 ====="
          strings -a "$IMG" | grep -F "$DISP" | head -2
          echo "===== KPM ====="
          strings -a "$IMG" | grep -E "KPM is (built in|\*not\* built in)" | head -2
          echo "===== SUSFS 符号数 ====="
          strings -a "$IMG" | grep -c susfs || true
          echo "===== 大小 ====="
          du -h "$IMG"

      - name: linux_banner 信息（仅打印，不阻塞）
        if: success()
        run: |
          cd ws/common
          echo "===== linux_banner ====="
          strings -a arch/arm64/boot/Image | grep "^Linux version 6\.12\." | while IFS= read -r l; do
            echo "  len=${#l}  ${l: -45}"
          done || true
          echo "（仅供参考：原厂内核本来就有两条 banner，长度差 1，不影响启动）"

      - name: 版本串 / 功能开关硬校验
        if: success()
        run: |
          cd ws/common
          IMG=arch/arm64/boot/Image
          strings -a "$IMG" | grep '^Linux version 6\.12' > /tmp/banners.txt || true
          TOTAL=$(wc -l < /tmp/banners.txt)
          GOOD=$(grep -c '#1 SMP PREEMPT Tue Sep  8 15:08:49 UTC 2026' /tmp/banners.txt || true)
          echo "Linux version 条数: $TOTAL，其中带 #1 的: $GOOD"
          sed -n '1,3p' /tmp/banners.txt | cut -c1-120
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::镜像里找不到 Linux version 串"; exit 1
          fi
          if [ "$TOTAL" -ne "$GOOD" ]; then
            echo "::error::还有 banner 不是 #1（fake_version v3 没生效，检测器能扫出来）"; exit 1
          fi
          if [ "${{ inputs.features }}" = "true" ]; then
            for k in TLS AF_UNIX_OOB; do
              v=$(grep -E "^CONFIG_${k}=" .config || true)
              echo "  $k -> ${v:-未启用}"
              [ -n "$v" ] || { echo "::error::features.config 里的 CONFIG_${k} 没生效"; exit 1; }
            done
          fi

      - name: GKI ABI 校验
        if: success()
        run: |
          cd ws/common
          echo "===== 基准（小米17 官方内核）====="
          echo "  struct module : 1600 字节 / 75 成员（两机型实测一致）"
          echo "  (CRC 仅供参考，check_version 已跳过校验)"
          echo
          echo "===== ④ 关键符号 CRC ====="
          if [ -f Module.symvers ]; then
            grep -E "\bkobject_uevent_env\b" Module.symvers || echo "  ⚠ 未找到符号"
          else
            echo "  ⚠ 无 vmlinux.symvers"
          fi
          echo
          echo "===== ③ struct module 尺寸 ====="
          if command -v pahole >/dev/null && [ -f vmlinux ]; then
            pahole -C module vmlinux 2>/dev/null | tail -2 || echo "  pahole 读取失败"
          else
            echo "  ⚠ pahole 或 vmlinux 缺失"
          fi
          echo
          echo "===== ABI 敏感配置检查 ====="
          for k in STACK_TRACER FUNCTION_TRACER FTRACE FUNCTION_GRAPH_TRACER DEBUG_INFO_BTF; do
            v=$(grep -E "^(CONFIG_${k}=|# CONFIG_${k} is not set)" .config 2>/dev/null | head -1)
            printf "  %-24s %s\n" "$k" "${v:-未定义}"
          done

      - name: ABI 硬校验（module_layout CRC）
        if: success()
        run: |
          cd ws/common
          echo "===== ABI 校验 ====="
          # CRC 说明：本内核 kernel/module/version.c 的 check_version() 直接返回 1，
          # 跳过符号 CRC 校验。产物 CRC 与设备原厂必然不同（编译器不同），
          # 这不影响厂商模块加载——pudding 已实测开机 + 全部模块加载。
          # 此处仅打印信息，不做失败判定。
          if [ -f vmlinux.symvers ]; then
            ML=$(grep -P "\tmodule_layout\t" vmlinux.symvers | head -1 | cut -f1)
            KU=$(grep -P "\tkobject_uevent_env\t" vmlinux.symvers | head -1 | cut -f1)
            echo "  产物 module_layout CRC    : ${ML:-缺失}"
            echo "  产物 kobject_uevent_env   : ${KU:-缺失}"
            echo "  校验策略: check_version() 跳过，CRC 一致与否不影响模块加载"
          else
            echo "  ⚠ vmlinux.symvers 缺失"
          fi
          echo ""
          echo "===== struct module 校验 ====="
          if command -v pahole >/dev/null && [ -f vmlinux ]; then
            pahole -C module vmlinux 2>/dev/null | tail -3 || true
            echo "  设备基准: 1600 字节 / 75 成员"
          else
            echo "  ⚠ pahole 或 vmlinux 缺失"
          fi
          echo ""
          echo "===== 导出符号数 ====="
          if [ -f vmlinux.symvers ]; then
            echo "  产物导出: $(wc -l < vmlinux.symvers)"
            echo "  设备导出: 14734  (基准)"
          fi
          echo ""
          echo "===== 关键 CONFIG 校验 ====="
          for k in TRIM_UNUSED_KSYMS EXTENDED_MODVERSIONS CFI_ICALL_NORMALIZE_INTEGERS \
                   MODULE_SCMVERSION DEBUG_INFO_BTF_MODULES RUST; do
            v=$(grep -E "^(CONFIG_${k}=|# CONFIG_${k} is not set)" .config 2>/dev/null | head -1)
            printf "  %-34s %s\n" "$k" "${v:-未定义}"
          done

      - name: 配置差异诊断
        if: always()
        run: |
          cd ws/common
          DEV="${{ inputs.device }}"
          [ -z "$DEV" ] && DEV=pudding
          if [ -f .config ] && [ -f "$GITHUB_WORKSPACE/configs/${DEV}_full.defconfig" ]; then
            echo "===== .config vs 设备配置 ====="
            python3 "$GITHUB_WORKSPACE/scripts/config_diff.py" "$GITHUB_WORKSPACE/configs/${DEV}_full.defconfig" .config || true
            cp .config "$GITHUB_WORKSPACE/built.config" || true
          else
            echo "缺少 .config"
          fi

      - name: ABI 硬门槛（RUST / ASHMEM 必须启用）
        run: |
          cd ws/common
          fail=0
          for k in RUST ASHMEM ANDROID_BINDER_IPC_RUST; do
            v=$(grep -E "^(CONFIG_${k}=|# CONFIG_${k} is not set)" .config 2>/dev/null | head -1)
            case "$v" in
              CONFIG_${k}=y*|CONFIG_${k}=m*) echo "  OK   $k";;
              *) echo "  FAIL $k -> ${v:-未定义}"; fail=1;;
            esac
          done
          if [ "$fail" = "1" ]; then
            echo "缺少 RUST/ASHMEM —— 刷入会导致 zygote 崩死"
            echo "--- 排查信息 ---"
            echo "rustc:   $(command -v rustc || echo 缺)"
            echo "bindgen: $(command -v bindgen || echo 缺)"
            bash scripts/rust_is_available.sh 2>&1 | tail -12 || true
            exit 1
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ws/common/build.log
          if-no-files-found: ignore

      - name: 打包整分区 boot 镜像（保持 AVB 布局）
        if: success()
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          cd ws/common
          DEV="${{ inputs.device }}"
          [ -z "$DEV" ] && DEV=pudding
          TPL="$GITHUB_WORKSPACE/configs/boot_template_${DEV}.img"

          # ① 本次指定了原版 boot（URL 或 Release 资产名）→ 用它，优先级最高
          #    固件更新后 boot 分区布局可能变，所以每次构建都可以带一份当次的官方 boot。
          BOOT_IN="${{ inputs.boot_template }}"
          if [ -n "$BOOT_IN" ]; then
            echo "使用本次指定的原版 boot: $BOOT_IN"
            case "$BOOT_IN" in
              http://*|https://*) curl -L --retry 3 --retry-delay 5 -o /tmp/tpl.raw "$BOOT_IN" ;;
              *) getdep "$BOOT_IN" /tmp/tpl.raw ;;
            esac
            case "$BOOT_IN" in
              *.gz|*.gzip) gunzip -c /tmp/tpl.raw > "$TPL" ;;
              *) cp /tmp/tpl.raw "$TPL" ;;
            esac
          fi

          # ② 没指定 → 私有仓库 configs/ 里的文件，或 Release(deps) 里的默认模板
          if [ ! -s "$TPL" ]; then
            if [ ! -f "$TPL" ] && getdep "boot_template_${DEV}.img.gz" /tmp/tpl.img.gz; then
              gunzip -c /tmp/tpl.img.gz > "$TPL"
            fi
          fi
          if [ ! -f "$TPL" ]; then
            echo "::error::没有整分区模板 boot_template_${DEV}.img(.gz)，无法产出可刷镜像"
            echo "  补救：手机上 su -c 'sh dump_boot_template.sh' 导出当前 boot 分区，"
            echo "        上传成 pudding-private Release(deps) 的 boot_template_${DEV}.img.gz"
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/boot_${DEV}_nokpm.img"
          python3 "$GITHUB_WORKSPACE/scripts/pack_boot.py" "$TPL" arch/arm64/boot/Image "$OUT"
          gzip -9 -n -c "$OUT" > "$OUT.gz"
          echo "产物: $OUT  $(stat -c %s "$OUT") 字节  md5=$(md5sum "$OUT" | cut -d' ' -f1)"

          # 顺手切出 kernel 段（手机端整段拼接刷机用，不需要电脑）
          python3 - "$OUT" "$GITHUB_WORKSPACE/kernel_seg_${DEV}.bin" <<'PYEOF'
          import sys
          d = open(sys.argv[1], 'rb').read()
          ks = int.from_bytes(d[8:12], 'little')
          open(sys.argv[2], 'wb').write(d[4096:4096 + ks])
          print(f'kernel 段: {ks} 字节')
          PYEOF
          gzip -9 -n -c "$GITHUB_WORKSPACE/kernel_seg_${DEV}.bin" > "$GITHUB_WORKSPACE/kernel_seg_${DEV}.bin.gz"

          # 硬门槛：布局必须与模板一致（vbmeta/AVB 一个字节不能动），内核必须真的是这次编的
          python3 "$GITHUB_WORKSPACE/scripts/verify_boot_image.py" "$TPL" "$OUT" arch/arm64/boot/Image "$GITHUB_WORKSPACE/kernel_seg_${DEV}.bin"
          ls -la "$GITHUB_WORKSPACE"/boot_${DEV}_nokpm.img.gz "$GITHUB_WORKSPACE"/kernel_seg_${DEV}.bin.gz

      - name: 自动发布（出可直接刷的包）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEV="${{ inputs.device }}"
          [ -z "$DEV" ] && DEV=pudding
          TAG="${DEV}-build-$(date -u +%y%m%d%H%M%S)"
          IMG="$GITHUB_WORKSPACE/boot_${DEV}_nokpm.img"
          if [ ! -f "$IMG.gz" ]; then
            echo "::error::没有 boot_${DEV}_nokpm.img.gz，拒绝发布"
            exit 1
          fi

          # ---- 附带产物：裸内核 / 配置 / 符号表 / 刷机说明 ----
          gzip -9 -n -c ws/common/arch/arm64/boot/Image > "$GITHUB_WORKSPACE/Image-6.12.69.gz"
          cp -f ws/common/.config "$GITHUB_WORKSPACE/${DEV}.config"
          cp -f ws/common/vmlinux.symvers "$GITHUB_WORKSPACE/${DEV}.symvers" 2>/dev/null || true
          VER=$(strings -a ws/common/arch/arm64/boot/Image | grep -oE '6\.12\.[0-9]+-android16-6-[a-z0-9]+-abogki[0-9]+-4k' | head -1)

          cat > "$GITHUB_WORKSPACE/README-flash.md" <<'MDEOF'
          # __TAG__

          内核版本串：`__VER__`
          ACK 基线（钉死）：`__ACK__`
          SukiSU（钉死）：`1b0a5ee4c4e8`

          ## 小米17 (pudding) 刷法

          这块机的 boot 分区是 `[header + kernel 段][vbmeta@0x2304000][AVB 尾]` 三段固定偏移，
          **只能用下面两种方式，不要用 AnyKernel3 / magiskboot 重打包**（会把 vbmeta 挪位，刷完卡第一屏且不报错）。

          ### A. 有电脑（fastboot）
          ```
          gunzip boot___DEV___nokpm.img.gz
          fastboot flash boot_b boot___DEV___nokpm.img
          fastboot reboot
          ```

          ### B. 手机上（root，无需电脑）
          ```
          gunzip kernel_seg___DEV__.bin.gz
          su -c "sh flash_ondevice.sh /sdcard/Download/kernel_seg___DEV__.bin"
          ```
          只做三次 dd，vbmeta / AVB 页脚一个字节不动。

          ### 回退
          fastboot 刷回上一版 `boot_xxx_nokpm.img`，或用本次之前的 `kernel_seg_*.bin` 重跑 B。

          ## 其它文件
          - `Image-6.12.69.gz`：裸 arm64 Image（自己打包用）
          - `__DEV__.config`：最终生效的 .config
          - `__DEV__.symvers`：vmlinux.symvers
          MDEOF
          sed -i "s/__TAG__/$TAG/;s/__VER__/$VER/;s/__ACK__/${{ steps.rev.outputs.commit }}/g;s/__DEV__/$DEV/g" "$GITHUB_WORKSPACE/README-flash.md"

          FILES="$IMG.gz $GITHUB_WORKSPACE/kernel_seg_${DEV}.bin.gz $GITHUB_WORKSPACE/scripts/flash_ondevice.sh"
          FILES="$FILES $GITHUB_WORKSPACE/Image-6.12.69.gz $GITHUB_WORKSPACE/${DEV}.config $GITHUB_WORKSPACE/README-flash.md"
          [ -f "$GITHUB_WORKSPACE/${DEV}.symvers" ] && FILES="$FILES $GITHUB_WORKSPACE/${DEV}.symvers"

          PUBLISH="${{ inputs.publish }}"
          [ -z "$PUBLISH" ] && PUBLISH=draft
          case "$PUBLISH" in
            none) echo "publish=none，不建 Release（产物仍在 artifact 里）"; exit 0;;
            draft) DRAFTFLAG="--draft";;
            *) DRAFTFLAG="";;
          esac
          gh release create "$TAG" $FILES $DRAFTFLAG --title "$TAG" --notes "内核 $VER
          fastboot 刷 boot_${DEV}_nokpm.img；手机上用 kernel_seg_${DEV}.bin.gz + flash_ondevice.sh。
          不要用 AnyKernel3 / magiskboot 重打包（会把 vbmeta 挪位导致卡第一屏）。"

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image-6.12.69
          path: |
            ws/common/arch/arm64/boot/Image
            ws/common/vmlinux.symvers
            ws/common/.config
            boot_*_nokpm.img
            boot_*_nokpm.img.gz
            kernel_seg_*.bin.gz
            scripts/flash_ondevice.sh
