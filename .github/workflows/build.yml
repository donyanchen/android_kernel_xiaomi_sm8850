name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      ack_branch:
        description: 'ACK 源码分支'
        required: true
        default: 'android16-6.12-2026-03'
        type: string
      kpm:
        description: '启用内建 KPM'
        required: true
        default: true
        type: boolean
      features:
        description: '启用额外特性配置'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境准备
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev \
            libelf-dev lz4 zstd python3 zip unzip aria2 ccache rsync cpio
          ccache -M 2G || true

      - name: 下载 ACK 源码
        run: |
          mkdir -p ws && cd ws
          aria2c -s16 -x16 -k1M --file-allocation=none \
            "https://github.com/cctv18/android_gki_kernel_common/archive/refs/heads/${{ inputs.ack_branch }}.zip" -o ack.zip
          unzip -q ack.zip
          mv android_gki_kernel_common-* common
          echo "源码版本: $(head -3 common/Makefile | tail -3 | tr '\n' ' ')"

      - name: 下载工具链
        run: |
          cd ws
          BASE="https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225"
          aria2c -s16 -x16 -k1M --file-allocation=none "$BASE/clang-r536225.zip" -o clang.zip
          aria2c -s16 -x16 -k1M --file-allocation=none "$BASE/rust.zip" -o rust.zip
          aria2c -s16 -x16 -k1M --file-allocation=none "$BASE/build-tools.zip" -o build-tools.zip
          unzip -q clang.zip; unzip -q rust.zip; unzip -qo build-tools.zip
          ls -d */ | head -6

      - name: 集成 SukiSU
        run: |
          cd ws/common
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s main
          UAPI_SRC=$(find . -maxdepth 3 -type d -name uapi | head -1)
          echo "uapi 来源: $UAPI_SRC"
          mkdir -p drivers/kernelsu/uapi
          cp -f "$UAPI_SRC"/*.h drivers/kernelsu/uapi/ 2>/dev/null || true
          echo "uapi 头文件: $(ls drivers/kernelsu/uapi/ | wc -l) 个"

      - name: 兼容性补丁
        run: |
          cd ws/common
          python3 "$GITHUB_WORKSPACE/patches/fix_cb_mutex.py" \
            drivers/kernelsu/extension/kpm/super_access.c

      - name: 版本串（每次构建动态生成）
        id: ver
        run: |
          cd ws/common
          SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse --short=12 HEAD 2>/dev/null || echo 000000000000)
          RUN=$(printf '%09d' "${{ github.run_number }}")
          DISP="6.12.69-android16-6-g${SHA}-abogki${RUN}-4k"
          echo "显示版本: $DISP"
          echo "DISP=$DISP" >> "$GITHUB_ENV"
          sed -i "s|\"Linux version \" UTS_RELEASE|\"Linux version \" \"$DISP\"|" init/version.c 2>/dev/null || true
          sed -i "s|release = UTS_RELEASE;|release = \"$DISP\";|" init/utsname.c 2>/dev/null || true
          echo "version.c 命中: $(grep -c "$DISP" init/version.c 2>/dev/null || echo 0)"
          echo "utsname.c 命中: $(grep -c "$DISP" init/utsname.c 2>/dev/null || echo 0)"

      - name: 配置内核
        run: |
          cd ws/common
          C=arch/arm64/configs/gki_defconfig
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$C"
          if [ "${{ inputs.kpm }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$C"
            echo "CONFIG_KALLSYMS_ALL=y" >> "$C"
          fi
          if [ "${{ inputs.features }}" = "true" ]; then
            cat >> "$C" <<'CFGEOF'
            CONFIG_SCHED_CLASS_EXT=y
            CONFIG_UCLAMP_BUCKETS_COUNT=20
            CONFIG_LRU_GEN=y
            CONFIG_LRU_GEN_ENABLED=y
            CONFIG_ZSWAP=y
            CONFIG_ZRAM_WRITEBACK=y
            CONFIG_MQ_IOSCHED_KYBER=y
            CONFIG_TCP_CONG_BBR=y
            CONFIG_NETFILTER_XT_SET=y
            CONFIG_IP_SET=y
            CONFIG_WIREGUARD=y
            CONFIG_F2FS_FS_COMPRESSION=y
            CONFIG_EROFS_FS_ZIP=y
            CFGEOF
          fi
          tail -16 "$C"

      - name: 编译
        run: |
          cd ws/common
          export PATH="$PWD/../clang-r536225/bin:$PATH"
          export ARCH=arm64
          export CC=clang
          export LLVM=1
          export KBUILD_BUILD_USER=kleaf
          export KBUILD_BUILD_HOST=build-host
          export KBUILD_BUILD_TIMESTAMP="2026-09-08 15:08:49 UTC"
          make O=out ARCH=arm64 gki_defconfig
          make O=out ARCH=arm64 -j"$(nproc)" Image 2>&1 | tail -60
          ls -lh out/arch/arm64/boot/Image

      - name: 校验
        run: |
          cd ws/common
          IMG=out/arch/arm64/boot/Image
          echo "===== vermagic（必须等于 6.12.69-android16-6-4k）====="
          strings -a "$IMG" | grep -E "^6\.12\..*SMP preempt" | head -2
          echo "===== 显示串 ====="
          strings -a "$IMG" | grep -F "$DISP" | head -2
          echo "===== KPM ====="
          strings -a "$IMG" | grep -E "KPM is (built in|\*not\* built in)" | head -2
          echo "===== SUSFS 符号数 ====="
          strings -a "$IMG" | grep -c susfs || true
          echo "===== 大小 ====="
          du -h "$IMG"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Image-6.12.69
          path: ws/common/out/arch/arm64/boot/Image
